name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Type check (mypy)
        run: mypy src/tool_agent
      - name: Run tests with coverage
        run: pytest --cov=tool_agent --cov-report=term-missing
      - name: Agent demo run (scripted LLM, no credentials needed)
        run: |
          python scripts/run_agent.py | tee artifacts_agent.log
          python -c "
          from pathlib import Path
          log = Path('artifacts_agent.log').read_text()
          assert 'tool_calls' in log or 'tool: ' in log, 'no tool usage in trace'
          assert 'final answer' in log.lower(), 'no final answer'
          print('agent demo check passed')
          "
